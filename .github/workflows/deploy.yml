name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/calendary-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/calendary-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to the droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/docker-compose.edge.yml,deploy/Caddyfile,deploy/backup.sh"
          target: "/opt/calendary"
          strip_components: 1

      - name: Pull images and restart prod + edge stacks
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /opt/calendary
            docker network inspect web >/dev/null 2>&1 || docker network create web

            touch .env
            grep -v '^GOOGLE_CLIENT_ID=' .env > .env.tmp || true; mv .env.tmp .env
            grep -v '^GOOGLE_CLIENT_SECRET=' .env > .env.tmp || true; mv .env.tmp .env
            printf 'GOOGLE_CLIENT_ID=%s\n' "${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            grep -v '^RESEND_API_KEY=' .env > .env.tmp || true; mv .env.tmp .env
            printf 'RESEND_API_KEY=%s\n' "${{ secrets.RESEND_API_KEY }}" >> .env
            grep -v '^MONOBANK_MERCHANT_TOKEN=' .env > .env.tmp || true; mv .env.tmp .env
            printf 'MONOBANK_MERCHANT_TOKEN=%s\n' "${{ secrets.MONOBANK_MERCHANT_TOKEN }}" >> .env
            grep -v '^NOVA_POSHTA_API_KEY=' .env > .env.tmp || true; mv .env.tmp .env
            printf 'NOVA_POSHTA_API_KEY=%s\n' "${{ secrets.NOVA_POSHTA_API_KEY }}" >> .env
            # Aligned with deploy-staging.yml (#330) — previously prod-only had to be set by hand
            # via SSH, an asymmetry deploy-staging.yml never had. AI__Provider itself (which
            # actual provider is live) stays a runtime DB setting via the admin panel, not synced
            # here — this only keeps the configured providers' keys current.
            grep -v '^AI_OPENAI_API_KEY=' .env > .env.tmp || true; mv .env.tmp .env
            grep -v '^AI_GEMINI_API_KEY=' .env > .env.tmp || true; mv .env.tmp .env
            printf 'AI_OPENAI_API_KEY=%s\n' "${{ secrets.AI_OPENAI_API_KEY }}" >> .env
            printf 'AI_GEMINI_API_KEY=%s\n' "${{ secrets.AI_GEMINI_API_KEY }}" >> .env
            # Prod-only (see docker-compose.prod.yml's comment / SmsClubService) — deploy-staging.yml
            # does not thread this, so staging always falls back to the fixed "0000" code.
            grep -v '^SMSCLUB_API_KEY=' .env > .env.tmp || true; mv .env.tmp .env
            printf 'SMSCLUB_API_KEY=%s\n' "${{ secrets.SMSCLUB_API_KEY }}" >> .env
            # Same Spaces account/creds/region for both stacks — only the bucket is split
            # (DO_SPACES_BUCKET here / DO_SPACES_BUCKET_STAGING in deploy-staging.yml) for cleaner
            # data isolation; backup.sh also scopes each stack to its own restic repo path
            # regardless (calendary/prod vs calendary/staging).
            for key in DO_SPACES_KEY DO_SPACES_SECRET DO_SPACES_BUCKET DO_SPACES_REGION RESTIC_PASSWORD; do
              grep -v "^${key}=" .env > .env.tmp || true; mv .env.tmp .env
            done
            printf 'DO_SPACES_KEY=%s\n' "${{ secrets.DO_SPACES_KEY }}" >> .env
            printf 'DO_SPACES_SECRET=%s\n' "${{ secrets.DO_SPACES_SECRET }}" >> .env
            printf 'DO_SPACES_BUCKET=%s\n' "${{ secrets.DO_SPACES_BUCKET }}" >> .env
            printf 'DO_SPACES_REGION=%s\n' "${{ secrets.DO_SPACES_REGION }}" >> .env
            printf 'RESTIC_PASSWORD=%s\n' "${{ secrets.RESTIC_PASSWORD }}" >> .env
            # Separate password from staging's — this is direct admin login, not a read-only
            # lookup key, so a leaked staging password must not grant prod admin access.
            grep -v '^ADMIN_PASSWORD=' .env > .env.tmp || true; mv .env.tmp .env
            printf 'ADMIN_PASSWORD=%s\n' "${{ secrets.ADMIN_PASSWORD }}" >> .env

            chmod +x backup.sh
            # Non-blocking safety net right before the next `docker compose up -d` runs
            # Program.cs's db.Database.Migrate() — a backup-infra hiccup (e.g. Spaces not
            # configured yet) must not be able to block every future deploy. See #305.
            ./backup.sh --quick --target prod || echo "::warning::pre-migration backup failed, continuing deploy"

            # App stack first — this frees ports 80/443 by removing the old in-stack
            # Caddy (if present) as an orphan, before the edge stack claims them.
            docker compose -p calendary -f docker-compose.prod.yml --env-file .env pull
            docker compose -p calendary -f docker-compose.prod.yml --env-file .env up -d --remove-orphans

            docker compose -p calendary-edge -f docker-compose.edge.yml --env-file .env pull
            docker compose -p calendary-edge -f docker-compose.edge.yml --env-file .env up -d --remove-orphans

            docker image prune -f
