name: Run backup on demand

# Manual only — never runs automatically (the daily calendary-backup.timer systemd unit on the
# droplet already handles the schedule, see bootstrap.sh). Lets you trigger an out-of-band backup
# from GitHub without SSHing in yourself — runs the exact same deploy/backup.sh the timer and the
# pre-migration deploy step use.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which stack to back up"
        required: true
        default: all
        type: choice
        options:
          - all
          - prod
          - staging
      quick:
        description: "Skip the media volume (DB only, faster)"
        required: true
        default: false
        type: boolean

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy/backup.sh on the droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/calendary
            chmod +x backup.sh
            ARGS="--target ${{ inputs.target }}"
            if [ "${{ inputs.quick }}" = "true" ]; then
              ARGS="$ARGS --quick"
            fi
            ./backup.sh $ARGS
