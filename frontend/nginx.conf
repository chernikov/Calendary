server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Photos are POSTed as raw multipart files, capped at 20 MB by PhotoIntake on the backend.
    client_max_body_size 24m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for appends this hop's $remote_addr to whatever arrived (Caddy's
        # own X-Forwarded-For in prod/staging, nothing locally) — the backend's ForwardedHeaders
        # middleware walks this chain back to the real client IP for auth rate limiting (#301).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
