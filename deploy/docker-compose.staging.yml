networks:
  web:
    external: true

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "512"
    volumes:
      - mssql-staging-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ghcr.io/${GHCR_OWNER}/calendary-backend:develop
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Server=mssql,1433;Database=Calendary;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Cors__AllowedOrigins__0: "https://${STAGING_DOMAIN}"
      ASPNETCORE_ENVIRONMENT: "Staging"
      AI__Provider: "${AI_PROVIDER:-OpenAI}"
      AI__OpenAI__ApiKey: "${AI_OPENAI_API_KEY:-}"
      AI__Gemini__ApiKey: "${AI_GEMINI_API_KEY:-}"
      Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      Resend__ApiKey: "${RESEND_API_KEY:-}"
      Monobank__MerchantToken: "${MONOBANK_MERCHANT_TOKEN:-}"
      Monobank__PublicBaseUrl: "https://${STAGING_DOMAIN}"
      NovaPoshta__ApiKey: "${NOVA_POSHTA_API_KEY:-}"
      # Guarantees an admin account always exists (AdminSeeder, runs at startup) — no environment
      # should ever need a manual DB UPDATE to get admin access.
      AdminSeed__Password: "${ADMIN_PASSWORD:-}"
      # Read-only admin backup-status view (ResticBackupStatusService) — same values backup.sh
      # itself reads from this file; the backend never writes to this repository.
      Backup__DoSpacesKey: "${DO_SPACES_KEY:-}"
      Backup__DoSpacesSecret: "${DO_SPACES_SECRET:-}"
      Backup__DoSpacesBucket: "${DO_SPACES_BUCKET:-}"
      Backup__DoSpacesRegion: "${DO_SPACES_REGION:-}"
      Backup__ResticPassword: "${RESTIC_PASSWORD:-}"
    volumes:
      - media-staging-data:/app/App_Data/media
    depends_on:
      mssql:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GHCR_OWNER}/calendary-frontend:develop
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default: {}
      web:
        aliases: [frontend-staging]

volumes:
  mssql-staging-data:
  media-staging-data:
