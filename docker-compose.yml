services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    environment:
      ConnectionStrings__Default: "Server=mssql,1433;Database=Calendary;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      ASPNETCORE_ENVIRONMENT: "Development"
      Resend__ApiKey: "${RESEND_API_KEY:-}"
      AI__OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      AI__Gemini__ApiKey: "${GEMINI_API_KEY:-}"
    ports:
      - "5080:8080"
    depends_on:
      mssql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mssql-data:
